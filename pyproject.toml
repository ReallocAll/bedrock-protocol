[project]
name = "bedrock-protocol"
version = "0.5.0.dev0"
description = "Typed native Bedrock protocol codecs and schema compiler."
requires-python = ">=3.12"
license = "MIT AND Apache-2.0 AND BSD-3-Clause AND Zlib"
license-files = ["LICENSE", "licenses/*.txt"]
dependencies = []

[project.optional-dependencies]
compiler = ["click", "griffe"]

[project.scripts]
bpc = "bedrock_protocol.cli:main"

[dependency-groups]
dev = ["mypy", "pytest", "pytest-xdist"]

[build-system]
requires = ["conan-py-build==0.6.4", "nanobind==3.1.0", "click", "griffe"]
build-backend = "conan_py_build.build"

[tool.conan-py-build]
extra-arguments = ["-o=&:with_python=True", "-o=&:with_wire=True", "-o=&:with_tests=False"]

[tool.conan-py-build.wheel]
packages = ["src/bedrock_protocol"]
exclude = ["__pycache__", "*.pyc"]

[tool.conan-py-build.sdist]
include = ["protocol", "tests", "third_party", "licenses", "docs", "conanfile.py"]

[tool.mypy]
packages = ["bedrock_protocol"]
python_version = "3.12"
strict = true

[tool.ruff]
line-length = 120
lint.select = ["I", "E", "F"]

[tool.ruff.lint.per-file-ignores]
"protocol/*.py" = ["F811", "F821"]
